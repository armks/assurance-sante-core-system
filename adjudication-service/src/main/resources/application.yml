spring:
  application:
    name: adjudication-service
  autoconfigure:
    # pas d'utilisateur/mot de passe généré : l'auth se fait uniquement par JWT de service
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${JDBC_URL}
    username: ${JDBC_USER:svc_adjudication}
    password: ${JDBC_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: adjudication-pool
      maximum-pool-size: 5
      minimum-idle: 1
      # une transaction d'adjudication doit être courte ; on échoue vite si elle traîne
      connection-timeout: 5000

server:
  port: ${PORT:8081}
  error:
    include-message: always

service:
  jwt:
    # secret partagé HMAC — fourni UNIQUEMENT par l'environnement
    secret: ${SERVICE_JWT_SECRET}

logging:
  level:
    org.springframework.jdbc.core: INFO
